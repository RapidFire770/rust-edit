[package]
name = "rust-edit"
version = "0.1.0"
edition = "2021"
description = "Feature-rich terminal text & code editor (TUI)"
authors = ["josh"]
license = "MIT"
repository = "https://github.com/example/rust-edit"
readme = "README.md"
keywords = ["tui", "editor", "terminal", "ratatui", "text-editor"]
categories = ["command-line-utilities", "text-editors"]

[dependencies]
ratatui = "0.30.2"
crossterm = "0.28"
ropey = "1.6.1"
syntect = "5.3.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
directories = "5.0"
arboard = "3.4"
anyhow = "1.0"
regex = "1.10"

[dev-dependencies]
pretty_assertions = "1.4"

[[bin]]
name = "rust-edit"
path = "src/main.rs"
