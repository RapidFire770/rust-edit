[package]
name = "rust-edit"
version = "0.1.1"
edition = "2021"
description = "Feature-rich terminal text & code editor (TUI)"
authors = ["josh"]
license = "MIT"
repository = "https://github.com/RapidFire770/rust-edit"
readme = "README.md"
keywords = ["tui", "editor", "terminal", "ratatui", "text-editor"]
categories = ["command-line-utilities", "text-editors"]

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29"
ropey = "1.6.1"
syntect = "5.3.0"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.6"
directories = "6.0.0"
arboard = "3.6.1"
anyhow = "1.0"
regex = "1.13.1"
spellbook = "0.4.2"

[dev-dependencies]
pretty_assertions = "1.4"

[build-dependencies]
syntect = "5.3.0"

[[bin]]
name = "rust-edit"
path = "src/main.rs"
